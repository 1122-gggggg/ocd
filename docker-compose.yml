services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ocd
      # DEV-ONLY insecure default: local compose credentials only, never production.
      POSTGRES_PASSWORD: ocd
      POSTGRES_DB: ocd
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocd"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    # Prod image runs as USER nextjs; dev bind-mount (.:/app) is host-owned,
    # so run dev as root. Prod (Dockerfile CMD) stays non-root.
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      # Anonymous dev cache: isolates container turbopack output from the
      # host's `next build` output (sharing one .next corrupts both).
      - /app/.next
    environment:
      DATABASE_URL: postgresql://ocd:ocd@db:5432/ocd?schema=public
      DIRECT_URL: postgresql://ocd:ocd@db:5432/ocd?schema=public
      # DEV-ONLY insecure default: local dev only, never commit real secrets.
      AUTH_SECRET: dev-insecure-auth-secret-min-32-chars-ok
      AUTH_URL: http://localhost:3001
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET-}
      # DEV-ONLY insecure default: local dev admin seed password only.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme-admin}
      # Set SEED_ON_BOOT=1 to run prisma/seed.ts on `docker compose up`. Default: skip seed.
      SEED_ON_BOOT: ${SEED_ON_BOOT-}
    command: sh -c 'npx prisma migrate deploy && if [ "$$SEED_ON_BOOT" = "1" ]; then npx tsx prisma/seed.ts; fi && npm run dev -- --hostname 0.0.0.0 --port 3000'

volumes:
  pgdata:
