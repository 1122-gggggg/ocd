services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ocd
      POSTGRES_PASSWORD: ocd
      POSTGRES_DB: ocd
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocd"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      DATABASE_URL: postgresql://ocd:ocd@db:5432/ocd?schema=public
      DIRECT_URL: postgresql://ocd:ocd@db:5432/ocd?schema=public
      AUTH_SECRET: dev-insecure-auth-secret-min-32-chars-ok
      AUTH_URL: http://localhost:3001
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme-admin}
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  pgdata:
